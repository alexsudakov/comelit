# Comelit -> Telegram live interaction package.
#
# Current production-consumer example for the call-state-driven Ring lifecycle.
# Reviewed against Comelit 1.5.19 / Home Assistant 2026.9.
#
# The integration owns attached Ring media, snapshots and the 20-second
# recording. This automation never toggles switch.comelit_entrance_camera,
# never starts a second media session and never infers normal call end from a
# short local timer.
#
# Telegram target for this deployment:
#   notify.telegram_bot_6207024040_1001409356493
#
# /media must be available to Telegram Bot through allowlist_external_dirs.

automation:
  - id: comelit_ring_telegram_live
    alias: "Comelit — звонок в Telegram"
    description: >-
      При звонке в домофон отправляет актуальный кадр в Telegram,
      обновляет его пока backend считает этот event_id активным,
      отправляет 20-секундную запись и обрабатывает Open/Ignore.
      Время жизни звонка определяется sensor.comelit_call_state.

    mode: single
    max_exceeded: silent

    triggers:
      - trigger: event
        event_type: comelit_ring

    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.door == 'entrance'
             and trigger.event.data.event_id | default('') | string | length > 0 }}

    variables:
      telegram_notify_entity: notify.telegram_bot_6207024040_1001409356493
      call_state_entity: sensor.comelit_call_state
      entrance_button_entity: button.comelit_main_entrance_open_door

      # Defense-in-depth only. Normal call end is backend-observed.
      safety_timeout_seconds: 600

      event_id: "{{ trigger.event.data.event_id }}"
      door: "{{ trigger.event.data.door }}"
      open_callback_data: "{{ 'comelit|open|' ~ event_id }}"
      ignore_callback_data: "{{ 'comelit|ignore|' ~ event_id }}"
      started_at: "{{ now() }}"

      telegram_chat_id: ""
      telegram_message_id: ""
      snapshot_path: ""
      snapshot_sequence: 0
      recording_state: ""
      recording_path: ""
      terminal_outcome: ""

    actions:
      # Ring media is integration-owned. Wait only for its first retained JPEG.
      - wait_for_trigger:
          - trigger: event
            event_type: comelit_snapshot_updated
        timeout: "00:00:30"
        continue_on_timeout: false

      - condition: template
        value_template: >-
          {{ wait.trigger.event.data.event_id == event_id
             and wait.trigger.event.data.door == door }}

      - variables:
          snapshot_path: "{{ wait.trigger.event.data.snapshot_path }}"
          snapshot_sequence: "{{ wait.trigger.event.data.sequence | int(1) }}"

      - action: telegram_bot.send_photo
        data:
          entity_id:
            - "{{ telegram_notify_entity }}"
          file: "{{ snapshot_path }}"
          caption: >-
            🔔 Звонок в подъезд
            Кадр {{ snapshot_sequence }}
          inline_keyboard:
            - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
              - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]
        response_variable: telegram_send

      - variables:
          telegram_chat_id: >-
            {{ telegram_send.chats[0].chat_id | default('') }}
          telegram_message_id: >-
            {{ telegram_send.chats[0].message_id | default('') }}

      - condition: template
        value_template: >-
          {{ telegram_chat_id | string | length > 0
             and telegram_message_id | string | length > 0 }}

      - repeat:
          while:
            - condition: template
              value_template: "{{ terminal_outcome == '' }}"
            - condition: template
              value_template: >-
                {{ is_state(call_state_entity, 'ringing')
                   and state_attr(call_state_entity, 'event_id') | string
                       == event_id | string }}
            - condition: template
              value_template: >-
                {{ (as_timestamp(now()) - as_timestamp(started_at))
                   < safety_timeout_seconds }}

          sequence:
            - wait_for_trigger:
                - trigger: event
                  event_type: comelit_snapshot_updated
                - trigger: event
                  event_type: comelit_recording_complete
                - trigger: event
                  event_type: telegram_callback
                - trigger: state
                  entity_id: sensor.comelit_call_state
                  to: "idle"
                - trigger: state
                  entity_id: sensor.comelit_call_state
                  to: "error"
              timeout: "00:00:02"
              continue_on_timeout: true

            - choose:
                # New retained JPEG for this exact Ring.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.platform == 'event'
                           and wait.trigger.event.event_type
                               == 'comelit_snapshot_updated'
                           and wait.trigger.event.data.event_id == event_id }}
                  sequence:
                    - variables:
                        snapshot_path: "{{ wait.trigger.event.data.snapshot_path }}"
                        snapshot_sequence: >-
                          {{ wait.trigger.event.data.sequence | int(0) }}

                    - action: telegram_bot.edit_message_media
                      continue_on_error: true
                      data:
                        entity_id:
                          - "{{ telegram_notify_entity }}"
                        message_id: "{{ telegram_message_id }}"
                        media_type: photo
                        file: "{{ snapshot_path }}"
                        caption: >-
                          🔔 Звонок в подъезд
                          Кадр {{ snapshot_sequence }}
                          {% if recording_state | string | length > 0 %}
                          Запись: {{ recording_state }}
                          {% endif %}
                        inline_keyboard:
                          - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
                            - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]

                # Recording is independent from call lifetime.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.platform == 'event'
                           and wait.trigger.event.event_type
                               == 'comelit_recording_complete'
                           and wait.trigger.event.data.event_id == event_id }}
                  sequence:
                    - variables:
                        recording_state: "{{ wait.trigger.event.data.state }}"
                        recording_path: >-
                          {{ wait.trigger.event.data.recording_path | default('') }}

                    - action: telegram_bot.edit_caption
                      continue_on_error: true
                      data:
                        entity_id:
                          - "{{ telegram_notify_entity }}"
                        message_id: "{{ telegram_message_id }}"
                        caption: >-
                          🔔 Звонок в подъезд
                          Кадр {{ snapshot_sequence }}
                          Запись: {{ recording_state }}
                        inline_keyboard:
                          - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
                            - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: >-
                                {{ recording_state in ['completed', 'truncated']
                                   and recording_path | string | length > 0 }}
                          sequence:
                            - action: telegram_bot.send_video
                              continue_on_error: true
                              data:
                                entity_id:
                                  - "{{ telegram_notify_entity }}"
                                file: "{{ recording_path }}"
                                caption: >-
                                  🎬 Comelit — запись звонка
                                  Состояние: {{ recording_state }}
                                reply_to_message_id: "{{ telegram_message_id }}"

                # Authoritative backend call end for this event_id.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.platform == 'state'
                           and wait.trigger.entity_id == call_state_entity
                           and wait.trigger.to_state.state == 'idle'
                           and wait.trigger.from_state is not none
                           and wait.trigger.from_state.attributes.event_id | string
                               == event_id | string }}
                  sequence:
                    - variables:
                        terminal_outcome: call_ended

                # Backend call error for this event_id.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.platform == 'state'
                           and wait.trigger.entity_id == call_state_entity
                           and wait.trigger.to_state.state == 'error'
                           and wait.trigger.to_state.attributes.event_id | string
                               == event_id | string }}
                  sequence:
                    - variables:
                        terminal_outcome: call_error

                # OPEN: one explicit semantic HA button press, same current
                # path as the Comelit Custom Card. No retry, no media stop.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.platform == 'event'
                           and wait.trigger.event.event_type == 'telegram_callback'
                           and wait.trigger.event.data.data == open_callback_data
                           and wait.trigger.event.data.chat_id | string
                               == telegram_chat_id | string
                           and wait.trigger.event.data.message is mapping
                           and wait.trigger.event.data.message.message_id | string
                               == telegram_message_id | string
                           and is_state(call_state_entity, 'ringing')
                           and state_attr(call_state_entity, 'event_id') | string
                               == event_id | string }}
                  sequence:
                    - action: telegram_bot.answer_callback_query
                      continue_on_error: true
                      data:
                        callback_query_id: "{{ wait.trigger.event.data.id }}"
                        message: "Открываю дверь…"

                    - variables:
                        terminal_outcome: open_requested

                    - action: comelit.emit_ring_interaction
                      continue_on_error: true
                      data:
                        event_id: "{{ event_id }}"
                        door: "{{ door }}"
                        outcome: open_requested
                        chat_id: "{{ telegram_chat_id }}"
                        message_id: "{{ telegram_message_id }}"

                    - action: button.press
                      continue_on_error: true
                      target:
                        entity_id: "{{ entrance_button_entity }}"

                # IGNORE is Telegram semantics only. It never stops/hangs up
                # the real Comelit call.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.platform == 'event'
                           and wait.trigger.event.event_type == 'telegram_callback'
                           and wait.trigger.event.data.data == ignore_callback_data
                           and wait.trigger.event.data.chat_id | string
                               == telegram_chat_id | string
                           and wait.trigger.event.data.message is mapping
                           and wait.trigger.event.data.message.message_id | string
                               == telegram_message_id | string
                           and is_state(call_state_entity, 'ringing')
                           and state_attr(call_state_entity, 'event_id') | string
                               == event_id | string }}
                  sequence:
                    - action: telegram_bot.answer_callback_query
                      continue_on_error: true
                      data:
                        callback_query_id: "{{ wait.trigger.event.data.id }}"
                        message: "Звонок проигнорирован"

                    - variables:
                        terminal_outcome: ignored

                    - action: comelit.emit_ring_interaction
                      continue_on_error: true
                      data:
                        event_id: "{{ event_id }}"
                        door: "{{ door }}"
                        outcome: ignored
                        chat_id: "{{ telegram_chat_id }}"
                        message_id: "{{ telegram_message_id }}"

            # Close a race where call state changes between while and wait.
            - if:
                - condition: template
                  value_template: >-
                    {{ terminal_outcome == ''
                       and (
                         not is_state(call_state_entity, 'ringing')
                         or state_attr(call_state_entity, 'event_id') | string
                            != event_id | string
                       ) }}
              then:
                - variables:
                    terminal_outcome: >-
                      {% if is_state(call_state_entity, 'error') %}
                        call_error
                      {% else %}
                        call_ended
                      {% endif %}

      # If only the abnormal 600-second automation guard ended the loop,
      # record the historical interaction outcome vocabulary as timeout.
      - if:
          - condition: template
            value_template: "{{ terminal_outcome == '' }}"
        then:
          - variables:
              terminal_outcome: safety_timeout

          - action: comelit.emit_ring_interaction
            continue_on_error: true
            data:
              event_id: "{{ event_id }}"
              door: "{{ door }}"
              outcome: timeout
              chat_id: "{{ telegram_chat_id }}"
              message_id: "{{ telegram_message_id }}"

      - action: telegram_bot.edit_caption
        continue_on_error: true
        data:
          entity_id:
            - "{{ telegram_notify_entity }}"
          message_id: "{{ telegram_message_id }}"
          caption: >-
            🔔 Звонок в подъезд
            Кадр {{ snapshot_sequence }}
            {% if recording_state | string | length > 0 %}
            Запись: {{ recording_state }}
            {% endif %}

            {% if terminal_outcome == 'open_requested' %}
            🚪 Запрос на открытие отправлен
            {% elif terminal_outcome == 'ignored' %}
            🙈 Звонок проигнорирован
            {% elif terminal_outcome == 'call_error' %}
            ⚠️ Звонок завершён с ошибкой
            {% elif terminal_outcome == 'safety_timeout' %}
            ⏱ Взаимодействие завершено по защитному таймауту
            {% else %}
            📞 Звонок завершён
            {% endif %}

      - action: telegram_bot.edit_replymarkup
        continue_on_error: true
        data:
          entity_id:
            - "{{ telegram_notify_entity }}"
          message_id: "{{ telegram_message_id }}"
          inline_keyboard: []
