# Comelit -> Telegram live interaction package.
#
# Validated against Home Assistant 2026.9.1 by a full synthetic-ring trace.
#
# This package consumes the integration-owned Comelit ring-media lifecycle.
# It does NOT start a second media session and does NOT call camera.snapshot.
#
# Telegram target for this deployment:
#   notify.telegram_bot_6207024040_1001409356493
#
# /media must be available to Telegram Bot through allowlist_external_dirs.

automation:
  - id: comelit_ring_telegram_live
    alias: "Comelit — звонок в Telegram"
    description: >-
      При звонке в домофон показывает актуальный кадр в Telegram,
      обновляет его по мере поступления новых снимков, отправляет
      20-секундную запись и обрабатывает кнопки открытия/игнорирования.
    mode: single
    max_exceeded: silent

    triggers:
      - trigger: event
        event_type: comelit_ring

    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.door == 'entrance'
             and trigger.event.data.event_id | default('') | string | length > 0 }}

    variables:
      telegram_notify_entity: notify.telegram_bot_6207024040_1001409356493
      event_id: "{{ trigger.event.data.event_id }}"
      door: "{{ trigger.event.data.door }}"
      open_callback_data: "{{ 'comelit|open|' ~ event_id }}"
      ignore_callback_data: "{{ 'comelit|ignore|' ~ event_id }}"
      started_at: "{{ now() }}"
      telegram_chat_id: ""
      telegram_message_id: ""
      snapshot_path: ""
      snapshot_sequence: 0
      recording_state: ""
      recording_path: ""
      terminal_outcome: ""

    actions:
      # First decodable JPEG may arrive noticeably later than comelit_ring.
      - wait_for_trigger:
          - trigger: event
            event_type: comelit_snapshot_updated
        timeout: "00:00:30"
        continue_on_timeout: false

      - condition: template
        value_template: >-
          {{ wait.trigger.event.data.event_id == event_id
             and wait.trigger.event.data.door == door }}

      - variables:
          snapshot_path: "{{ wait.trigger.event.data.snapshot_path }}"
          snapshot_sequence: "{{ wait.trigger.event.data.sequence | int(1) }}"

      # First Telegram message: retained integration-owned JPEG + controls.
      - action: telegram_bot.send_photo
        data:
          entity_id:
            - "{{ telegram_notify_entity }}"
          file: "{{ snapshot_path }}"
          caption: >-
            🔔 Звонок в подъезд
            Кадр {{ snapshot_sequence }}
          inline_keyboard:
            - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
              - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]
        response_variable: telegram_send

      - variables:
          telegram_chat_id: >-
            {{ telegram_send.chats[0].chat_id | default('') }}
          telegram_message_id: >-
            {{ telegram_send.chats[0].message_id | default('') }}

      - condition: template
        value_template: >-
          {{ telegram_chat_id | string | length > 0
             and telegram_message_id | string | length > 0 }}

      # Up to 60 s:
      # - update the same Telegram photo for this event_id;
      # - send the retained recording when complete;
      # - accept only callbacks from this exact chat/message/event.
      - repeat:
          while:
            - condition: template
              value_template: "{{ terminal_outcome == '' }}"
            - condition: template
              value_template: >-
                {{ (as_timestamp(now()) - as_timestamp(started_at)) < 60 }}
          sequence:
            - wait_for_trigger:
                - trigger: event
                  event_type: comelit_snapshot_updated
                - trigger: event
                  event_type: comelit_recording_complete
                - trigger: event
                  event_type: telegram_callback
              timeout: "00:00:02"
              continue_on_timeout: true

            - choose:
                # New JPEG belonging to this exact ring.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.event.event_type == 'comelit_snapshot_updated'
                           and wait.trigger.event.data.event_id == event_id }}
                  sequence:
                    - variables:
                        snapshot_path: "{{ wait.trigger.event.data.snapshot_path }}"
                        snapshot_sequence: "{{ wait.trigger.event.data.sequence | int(0) }}"

                    - action: telegram_bot.edit_message_media
                      continue_on_error: true
                      data:
                        entity_id:
                          - "{{ telegram_notify_entity }}"
                        message_id: "{{ telegram_message_id }}"
                        media_type: photo
                        file: "{{ snapshot_path }}"
                        caption: >-
                          🔔 Звонок в подъезд
                          Кадр {{ snapshot_sequence }}
                        inline_keyboard:
                          - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
                            - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]

                # Terminal recording event belonging to this exact ring.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.event.event_type == 'comelit_recording_complete'
                           and wait.trigger.event.data.event_id == event_id }}
                  sequence:
                    - variables:
                        recording_state: "{{ wait.trigger.event.data.state }}"
                        recording_path: "{{ wait.trigger.event.data.recording_path }}"

                    - action: telegram_bot.edit_caption
                      continue_on_error: true
                      data:
                        entity_id:
                          - "{{ telegram_notify_entity }}"
                        message_id: "{{ telegram_message_id }}"
                        caption: >-
                          🔔 Звонок в подъезд
                          Кадр {{ snapshot_sequence }}
                          Запись: {{ recording_state }}
                        inline_keyboard:
                          - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
                            - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: >-
                                {{ recording_state in ['completed', 'truncated']
                                   and recording_path | string | length > 0 }}
                          sequence:
                            - action: telegram_bot.send_video
                              continue_on_error: true
                              data:
                                entity_id:
                                  - "{{ telegram_notify_entity }}"
                                file: "{{ recording_path }}"
                                caption: >-
                                  🎬 Comelit — запись звонка
                                  Состояние: {{ recording_state }}
                                reply_to_message_id: "{{ telegram_message_id }}"

                # Open is accepted only from the exact Telegram message emitted
                # for this event_id, inside the bounded interaction window.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.event.event_type == 'telegram_callback'
                           and wait.trigger.event.data.data == open_callback_data
                           and wait.trigger.event.data.chat_id | string
                               == telegram_chat_id | string
                           and wait.trigger.event.data.message is mapping
                           and wait.trigger.event.data.message.message_id | string
                               == telegram_message_id | string }}
                  sequence:
                    - action: telegram_bot.answer_callback_query
                      continue_on_error: true
                      data:
                        callback_query_id: "{{ wait.trigger.event.data.id }}"
                        message: "Открываю дверь…"

                    - variables:
                        terminal_outcome: open_requested

                # Ignore uses the same exact event/chat/message correlation.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.event.event_type == 'telegram_callback'
                           and wait.trigger.event.data.data == ignore_callback_data
                           and wait.trigger.event.data.chat_id | string
                               == telegram_chat_id | string
                           and wait.trigger.event.data.message is mapping
                           and wait.trigger.event.data.message.message_id | string
                               == telegram_message_id | string }}
                  sequence:
                    - action: telegram_bot.answer_callback_query
                      continue_on_error: true
                      data:
                        callback_query_id: "{{ wait.trigger.event.data.id }}"
                        message: "Звонок проигнорирован"

                    - variables:
                        terminal_outcome: ignored

      # If the user has already decided, release an active media lease.
      # If media has naturally completed, this is a no-op.
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ terminal_outcome in ['open_requested', 'ignored'] }}
            sequence:
              - if:
                  - condition: state
                    entity_id: switch.comelit_entrance_camera
                    state: "on"
                then:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.comelit_entrance_camera

      # Door actuation is reachable only through the correlated Open callback.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ terminal_outcome == 'open_requested' }}"
            sequence:
              - wait_template: >-
                  {{ is_state('switch.comelit_entrance_camera', 'off')
                     and is_state('sensor.comelit_listener_status', 'ready') }}
                timeout: "00:00:10"
                continue_on_timeout: false

              - action: comelit.open_door
                data:
                  door: entrance
                  event_id: "{{ event_id }}"

      # Remove stale controls after Open / Ignore / timeout.
      - action: telegram_bot.edit_replymarkup
        continue_on_error: true
        data:
          entity_id:
            - "{{ telegram_notify_entity }}"
          message_id: "{{ telegram_message_id }}"
          inline_keyboard: []
