# Comelit -> Telegram live interaction package.
#
# This package consumes the integration-owned Comelit ring-media lifecycle.
# It does NOT start a second media session and does NOT call camera.snapshot.
#
# Telegram target for this deployment:
#   notify.telegram_bot_6207024040_202060054
#
# /media must be available to Telegram Bot through allowlist_external_dirs.

automation:
  # ---------------------------------------------------------------------------
  # 1. Ring/media automation
  # ---------------------------------------------------------------------------
  - id: comelit_ring_telegram_live
    alias: "Comelit — звонок в Telegram"
    description: >-
      Отправляет первый кадр звонка в Telegram, обновляет это же фото по
      comelit_snapshot_updated и отправляет готовую запись по
      comelit_recording_complete.
    mode: single
    max_exceeded: silent

    triggers:
      - trigger: event
        event_type: comelit_ring

    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.door == 'entrance'
             and trigger.event.data.event_id | default('') | string | length > 0 }}

    variables:
      telegram_notify_entity: notify.telegram_bot_6207024040_202060054
      event_id: "{{ trigger.event.data.event_id }}"
      door: "{{ trigger.event.data.door }}"
      open_callback_data: "{{ '/comelit_open ' ~ event_id }}"
      ignore_callback_data: "{{ '/comelit_ignore ' ~ event_id }}"
      started_at: "{{ now() }}"
      telegram_message_id: ""
      snapshot_path: ""
      snapshot_sequence: 0
      recording_done: false
      recording_state: ""
      recording_path: ""

    actions:
      # First decodable JPEG may arrive noticeably later than comelit_ring.
      - wait_for_trigger:
          - trigger: event
            event_type: comelit_snapshot_updated
        timeout: "00:00:30"
        continue_on_timeout: false

      - condition: template
        value_template: >-
          {{ wait.trigger.event.data.event_id == event_id
             and wait.trigger.event.data.door == door }}

      - variables:
          snapshot_path: "{{ wait.trigger.event.data.snapshot_path }}"
          snapshot_sequence: "{{ wait.trigger.event.data.sequence | int(1) }}"

      - action: telegram_bot.send_photo
        data:
          entity_id:
            - "{{ telegram_notify_entity }}"
          file: "{{ snapshot_path }}"
          caption: >-
            🔔 Звонок в подъезд
            Кадр {{ snapshot_sequence }}
          inline_keyboard:
            - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
              - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]
        response_variable: telegram_send

      - variables:
          telegram_message_id: >-
            {{ telegram_send.chats[0].message_id | default('') }}

      - condition: template
        value_template: "{{ telegram_message_id | string | length > 0 }}"

      # Update the same Telegram photo while the integration produces snapshots.
      # Stop this automation after recording completes or after 60 seconds.
      - repeat:
          while:
            - condition: template
              value_template: "{{ not recording_done }}"
            - condition: template
              value_template: >-
                {{ (as_timestamp(now()) - as_timestamp(started_at)) < 60 }}
          sequence:
            - wait_for_trigger:
                - trigger: event
                  event_type: comelit_snapshot_updated
                - trigger: event
                  event_type: comelit_recording_complete
              timeout: "00:00:02"
              continue_on_timeout: true

            - choose:
                # New JPEG belonging to this exact ring event.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.event.event_type == 'comelit_snapshot_updated'
                           and wait.trigger.event.data.event_id == event_id }}
                  sequence:
                    - variables:
                        snapshot_path: "{{ wait.trigger.event.data.snapshot_path }}"
                        snapshot_sequence: "{{ wait.trigger.event.data.sequence | int(0) }}"

                    - action: telegram_bot.edit_message_media
                      continue_on_error: true
                      data:
                        entity_id:
                          - "{{ telegram_notify_entity }}"
                        message_id: "{{ telegram_message_id }}"
                        media_type: photo
                        file: "{{ snapshot_path }}"
                        caption: >-
                          🔔 Звонок в подъезд
                          Кадр {{ snapshot_sequence }}
                        inline_keyboard:
                          - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
                            - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]

                # Terminal recording event belonging to this exact ring.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ wait.completed
                           and wait.trigger.event.event_type == 'comelit_recording_complete'
                           and wait.trigger.event.data.event_id == event_id }}
                  sequence:
                    - variables:
                        recording_done: true
                        recording_state: "{{ wait.trigger.event.data.state }}"
                        recording_path: "{{ wait.trigger.event.data.recording_path }}"

                    - action: telegram_bot.edit_caption
                      continue_on_error: true
                      data:
                        entity_id:
                          - "{{ telegram_notify_entity }}"
                        message_id: "{{ telegram_message_id }}"
                        caption: >-
                          🔔 Звонок в подъезд
                          Кадр {{ snapshot_sequence }}
                          Запись: {{ recording_state }}
                        inline_keyboard:
                          - - ["🚪 Открыть дверь", "{{ open_callback_data }}"]
                            - ["🙈 Игнорировать", "{{ ignore_callback_data }}"]

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: >-
                                {{ recording_state in ['completed', 'truncated']
                                   and recording_path | string | length > 0 }}
                          sequence:
                            - action: telegram_bot.send_video
                              continue_on_error: true
                              data:
                                entity_id:
                                  - "{{ telegram_notify_entity }}"
                                file: "{{ recording_path }}"
                                caption: >-
                                  🎬 Comelit — запись звонка
                                  Состояние: {{ recording_state }}
                                reply_to_message_id: "{{ telegram_message_id }}"

  # ---------------------------------------------------------------------------
  # 2. Telegram button: Open door
  # ---------------------------------------------------------------------------
  - id: comelit_telegram_open_door
    alias: "Comelit — Telegram — открыть дверь"
    description: >-
      Обрабатывает callback-команду /comelit_open <event_id>. Если media-session
      ещё активна, сначала безопасно завершает её и ждёт восстановления listener.
    mode: single
    max_exceeded: silent

    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: /comelit_open

    variables:
      telegram_notify_entity: notify.telegram_bot_6207024040_202060054
      event_id: "{{ trigger.event.data.args[0] | default('') }}"
      callback_query_id: "{{ trigger.event.data.id | default('') }}"
      telegram_message_id: >-
        {{ trigger.event.data.message.message_id | default('') }}

    conditions:
      - condition: template
        value_template: "{{ event_id | string | length > 0 }}"

    actions:
      - action: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ callback_query_id }}"
          message: "Открываю дверь…"

      - if:
          - condition: state
            entity_id: switch.comelit_entrance_camera
            state: "on"
        then:
          - action: switch.turn_off
            target:
              entity_id: switch.comelit_entrance_camera

      - wait_template: >-
          {{ is_state('switch.comelit_entrance_camera', 'off')
             and is_state('sensor.comelit_listener_status', 'ready') }}
        timeout: "00:00:10"
        continue_on_timeout: false

      - action: comelit.open_door
        data:
          door: entrance
          event_id: "{{ event_id }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ telegram_message_id | string | length > 0 }}"
            sequence:
              - action: telegram_bot.edit_replymarkup
                continue_on_error: true
                data:
                  entity_id:
                    - "{{ telegram_notify_entity }}"
                  message_id: "{{ telegram_message_id }}"
                  inline_keyboard: []

  # ---------------------------------------------------------------------------
  # 3. Telegram button: Ignore
  # ---------------------------------------------------------------------------
  - id: comelit_telegram_ignore_ring
    alias: "Comelit — Telegram — игнорировать"
    description: >-
      Обрабатывает callback-команду /comelit_ignore <event_id> и убирает кнопки
      из соответствующего Telegram-сообщения. Media-session продолжает штатную
      20-секундную запись.
    mode: single
    max_exceeded: silent

    triggers:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: /comelit_ignore

    variables:
      telegram_notify_entity: notify.telegram_bot_6207024040_202060054
      event_id: "{{ trigger.event.data.args[0] | default('') }}"
      callback_query_id: "{{ trigger.event.data.id | default('') }}"
      telegram_message_id: >-
        {{ trigger.event.data.message.message_id | default('') }}

    conditions:
      - condition: template
        value_template: "{{ event_id | string | length > 0 }}"

    actions:
      - action: telegram_bot.answer_callback_query
        continue_on_error: true
        data:
          callback_query_id: "{{ callback_query_id }}"
          message: "Звонок проигнорирован"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ telegram_message_id | string | length > 0 }}"
            sequence:
              - action: telegram_bot.edit_replymarkup
                continue_on_error: true
                data:
                  entity_id:
                    - "{{ telegram_notify_entity }}"
                  message_id: "{{ telegram_message_id }}"
                  inline_keyboard: []
