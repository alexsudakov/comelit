name: Retry attached observability patch

on:
  push:
    branches:
      - fix/attached-media-terminal-observability
    paths:
      - .github/workflows/retry-attached-observability-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attached-media-terminal-observability
          fetch-depth: 0
      - name: Run existing exact patch dependency-free
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/apply-attached-observability-patch.yml').read_text()
          marker = '        run: |\n'
          body = src.split(marker, 1)[1]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  break
          script = '\n'.join(lines) + '\n'
          old = 'python3 -m pytest -q safety-poc/tests/test_attached_media_runtime_observability_v2.py'
          new = "python3 - <<'PYTEST'\nimport runpy\nns = runpy.run_path('safety-poc/tests/test_attached_media_runtime_observability_v2.py')\nfor name, value in sorted(ns.items()):\n    if name.startswith('test_') and callable(value):\n        value()\nPYTEST"
          if old not in script:
              raise SystemExit('pytest command anchor missing')
          Path('/tmp/apply.sh').write_text(script.replace(old, new))
          PY
          bash /tmp/apply.sh
