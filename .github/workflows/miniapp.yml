name: miniapp

on:
  pull_request:
    paths:
      - "custom_components/comelit/miniapp/**"
      - "custom_components/comelit/frontend/miniapp/**"
      - "custom_components/comelit/frontend/comelit-card.js"
      - "custom_components/comelit/__init__.py"
      - "custom_components/comelit/config_flow.py"
      - "custom_components/comelit/const.py"
      - "custom_components/comelit/strings.json"
      - "custom_components/comelit/translations/en.json"
      - "tests/miniapp/**"
      - "docs/miniapp-architecture.md"
      - "README.md"
      - ".github/workflows/miniapp.yml"
  push:
    branches:
      - main
    paths:
      - "custom_components/comelit/miniapp/**"
      - "custom_components/comelit/frontend/miniapp/**"
      - "custom_components/comelit/frontend/comelit-card.js"
      - "custom_components/comelit/__init__.py"
      - "custom_components/comelit/config_flow.py"
      - "custom_components/comelit/const.py"
      - "custom_components/comelit/strings.json"
      - "custom_components/comelit/translations/en.json"
      - "tests/miniapp/**"
      - "docs/miniapp-architecture.md"
      - "README.md"
      - ".github/workflows/miniapp.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install embedded Mini App test dependencies
        run: python -m pip install pytest cryptography

      - name: Run embedded Mini App tests
        run: pytest -q tests/miniapp

      - name: Compile embedded Mini App Python
        run: python -m compileall -q custom_components/comelit/miniapp tests/miniapp

      - name: Parse Mini App host
        run: node --check custom_components/comelit/frontend/miniapp/host.js

      - name: Parse Mini App WebCodecs viewer
        run: node --check custom_components/comelit/frontend/miniapp/webcodecs.js

      - name: Parse bundled hls.js
        run: node --check custom_components/comelit/frontend/miniapp/vendor/hls.min.js

      - name: Parse shared bundled Comelit card
        run: node --check custom_components/comelit/frontend/comelit-card.js

      - name: Install browser regression dependencies
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Verify viewer layout and stalled ICE fallback
        run: node tests/miniapp/viewer.browser.cjs

      - name: Verify WebCodecs mock canary
        run: node tests/miniapp/webcodecs.browser.cjs

      - name: Verify WebRTC and HLS diagnostics scenarios
        run: node tests/miniapp/webrtc.scenarios.browser.cjs

      - name: Assert standalone gateway is gone
        run: |
          test ! -e miniapp
          test ! -e custom_components/comelit/frontend/miniapp/comelit-card.js
          grep -F '/api/comelit/frontend/comelit-card.js' custom_components/comelit/miniapp/index.html
