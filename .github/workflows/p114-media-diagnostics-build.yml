name: p114-media-diagnostics-build

on:
  pull_request:
    paths:
      - 'custom_components/comelit/**'
      - 'safety-poc/research/media/v1/**'
      - 'safety-poc/tests/**'
      - '.github/workflows/p114-media-diagnostics-build.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic P114 diagnostics patch
        run: |
          python3 safety-poc/research/media/v1/p114_apply_media_diagnostics.py --write

      - name: Build musl helper offline from transformed source
        run: |
          set -euo pipefail
          rm -rf .p114-build
          mkdir -p .p114-build
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            alpine:3.24 \
            /bin/sh -eu -c '
              apk add --no-cache build-base pkgconf glib-dev libnice-dev python3 binutils >/dev/null
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH=/repo/safety-poc/research/media/v1 \
              python3 /repo/safety-poc/research/media/v1/entrance_p80_ha_media_runtime_transform.py \
                --source /repo/safety-poc/research/door/v1_5_7/comelit-v4-persistent-ctpp-door.c \
                --output /repo/.p114-build/comelit-media.c >/repo/.p114-build/transform.log
              cc -O2 -g -Wall -Wextra -Wl,--as-needed \
                -o /repo/.p114-build/comelit-media \
                /repo/.p114-build/comelit-media.c \
                $(pkg-config --cflags --libs nice glib-2.0 gio-2.0 gobject-2.0)
              chmod 755 /repo/.p114-build/comelit-media
              readelf -l /repo/.p114-build/comelit-media > /repo/.p114-build/readelf-program.txt
              readelf -d /repo/.p114-build/comelit-media > /repo/.p114-build/readelf-dynamic.txt
              {
                echo "alpine_version=$(cat /etc/alpine-release)"
                echo "libnice_version=$(pkg-config --modversion nice)"
                echo "glib_version=$(pkg-config --modversion glib-2.0)"
                echo "candidate_executed=false"
              } > /repo/.p114-build/toolchain.txt
            '
          grep -Fq '/lib/ld-musl-x86_64.so.1' .p114-build/readelf-program.txt
          grep -Fq 'P80_VIDEO_RTP_PACKETS=' .p114-build/comelit-media.c
          grep -Fq 'P80_AUDIO_RTP_PACKETS=' .p114-build/comelit-media.c
          grep -Fq '#define P80_RTP_PROGRESS_CADENCE 50u' .p114-build/comelit-media.c
          ! grep -Fq 'signal(SIGUSR1, v4_door_signal_handler);' .p114-build/comelit-media.c
          install -m 755 .p114-build/comelit-media custom_components/comelit/native/comelit-media

      - name: Pin candidate SHA and write provenance
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(sha256sum custom_components/comelit/native/comelit-media | awk '{print $1}')"
          SOURCE_SHA="$(sha256sum .p114-build/comelit-media.c | awk '{print $1}')"
          python3 - "$CANDIDATE_SHA" <<'PY'
          from pathlib import Path
          import re
          import sys

          sha = sys.argv[1]
          transport = Path("custom_components/comelit/media_transport.py")
          text = transport.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(MEDIA_NATIVE_BINARY_SHA256 = \(\n    ")[0-9a-f]{64}("\n\))',
              rf'\g<1>{sha}\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("transport SHA pin gate failed")
          transport.write_text(text, encoding="utf-8")

          test = Path("safety-poc/tests/test_p80_media_transport_static_contract.py")
          text = test.read_text(encoding="utf-8")
          text, count = re.subn(
              r'EXPECTED_SHA256 = "[0-9a-f]{64}"',
              f'EXPECTED_SHA256 = "{sha}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("test SHA pin gate failed")
          test.write_text(text, encoding="utf-8")
          PY
          {
            echo 'P114_MEDIA_DIAGNOSTICS_BUILD=PROVEN_OFFLINE'
            echo "GENERATED_SOURCE_SHA256=$SOURCE_SHA"
            echo "NATIVE_BINARY_SHA256=$CANDIDATE_SHA"
            cat .p114-build/toolchain.txt
            echo 'P80_RTP_PROGRESS_CADENCE=50'
            echo 'HA_STATE_UPDATE_MIN_INTERVAL_SECONDS=1.0'
            echo 'LIVE_INVOCATIONS=0'
            echo 'DOOR_ACTIONS=0'
            echo 'GATE_ACTIONS=0'
          } > safety-poc/research/media/v1/p114_media_diagnostics_build_meta.txt

      - name: Compile and run repository offline tests
        env:
          PYTHONPATH: ${{ github.workspace }}/safety-poc/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile safety-poc/research/media/v1/p114_apply_media_diagnostics.py
          python3 -m compileall -q custom_components/comelit
          python3 safety-poc/scripts/static_safety_check.py
          python3 -m unittest discover -s safety-poc/tests -v

      - name: Verify observability-only diff gates
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff -- custom_components/comelit/media_transport.py | grep -c 'MEDIA_VIDEO_RTP_PORT = 17899' || true)" -eq 0
          test "$(git diff -- custom_components/comelit/media_transport.py | grep -c 'MEDIA_AUDIO_RTP_PORT = 17808' || true)" -eq 0
          ! git diff | grep -E '^\+.*(async_open_door|SIGUSR1|Gate|GATE_ACTION_SENT=true)'

      - name: Commit generated P114 code and binary to PR head
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'P114_GENERATED_DIFF=NONE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            custom_components/comelit/media_diagnostics.py \
            custom_components/comelit/media_transport.py \
            custom_components/comelit/camera.py \
            custom_components/comelit/native/comelit-media \
            safety-poc/research/media/v1/entrance_p80_ha_media_runtime_transform.py \
            safety-poc/research/media/v1/p114_media_diagnostics_build_meta.txt \
            safety-poc/tests/test_p80_ha_media_runtime_transform.py \
            safety-poc/tests/test_p80_media_transport_static_contract.py \
            safety-poc/tests/test_p80_ha_media_entity_wiring.py \
            safety-poc/tests/test_p114_media_progress_diagnostics.py
          git commit -m 'research(media): add bounded P114 runtime diagnostics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
