name: repair b13 attached-viewer heartbeat test

on:
  push:
    branches:
      - fix/runtime-reliability-security-hardening-b13

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[heartbeat-test-repaired]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make lease initialization explicit in fake-clock test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/miniapp/webrtc.scenarios.browser.cjs')
          text = p.read_text(encoding='utf-8')
          old = '''        await page.waitForFunction(() => window.__hlsOpenCount === 1);\n        await flush(page, 1);\n        const visibility = await page.evaluate(() => {\n'''
          new = '''        await page.waitForFunction(() => window.__hlsOpenCount === 1);\n        await flush(page, 1);\n        await page.waitForFunction(\n          () => window.testViewer?._attachedViewerHeartbeatTimer !== null,\n        );\n        const visibility = await page.evaluate(() => {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one heartbeat scenario anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit repaired test and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-b13-miniapp-heartbeat-test.yml
          git add tests/miniapp/webrtc.scenarios.browser.cjs
          git diff --cached --check
          git config user.name "alexsudakov"
          git config user.email "91778685+alexsudakov@users.noreply.github.com"
          git commit -m "test(miniapp): wait for attached-viewer lease before fake clock [heartbeat-test-repaired]"
          git push origin HEAD:fix/runtime-reliability-security-hardening-b13
