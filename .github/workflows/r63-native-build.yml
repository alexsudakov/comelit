name: R63 native build

on:
  push:
    branches:
      - fix/p116-r63-gate-peer-tap-actuation
    paths:
      - .github/workflows/r63-native-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate R63 source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .r63-build
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH=safety-poc/research/media/v1 \
          python3 safety-poc/research/media/v1/entrance_p116_r63_gate_peer_tap_actuation_transform.py \
            --source safety-poc/research/door/v1_5_7/comelit-v4-persistent-ctpp-door.c \
            --output .r63-build/comelit-r63.c
          sha256sum .r63-build/comelit-r63.c

      - name: Build reproducible Alpine musl binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE='alpine:3.24.1'
          for variant in a b; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/repo" \
              -w /repo \
              "$IMAGE" \
              /bin/sh -eu -c "
                apk add --no-cache build-base pkgconf glib-dev libnice-dev binutils file >/dev/null
                cc -O2 -g -Wall -Wextra -Wl,--as-needed \
                  -o /repo/.r63-build/comelit-v4-$variant \
                  /repo/.r63-build/comelit-r63.c \
                  \$(pkg-config --cflags --libs nice glib-2.0 gio-2.0 gobject-2.0)
                chmod 755 /repo/.r63-build/comelit-v4-$variant
              "
          done
          sha256sum .r63-build/comelit-v4-a .r63-build/comelit-v4-b
          cmp .r63-build/comelit-v4-a .r63-build/comelit-v4-b

      - name: Verify native ABI and markers
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          BIN=.r63-build/comelit-v4-a
          SRC=.r63-build/comelit-r63.c
          EXPECTED_INTERPRETER='/lib/ld-musl-x86_64.so.1'
          EXPECTED_NEEDED='libc.musl-x86_64.so.1,libglib-2.0.so.0,libgobject-2.0.so.0,libnice.so.10'

          INTERPRETER="$(readelf -l "$BIN" | sed -n 's@.*Requesting program interpreter: \(.*\)]@\1@p')"
          NEEDED="$(readelf -d "$BIN" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort | paste -sd, -)"
          test "$INTERPRETER" = "$EXPECTED_INTERPRETER"
          test "$NEEDED" = "$EXPECTED_NEEDED"

          strings -a "$BIN" | grep -Fq 'V4_DOOR_TARGET_VALID=false'
          strings -a "$BIN" | grep -Fq 'V4_DOOR_TARGET=%s'
          strings -a "$BIN" | grep -Fq '/run/comelit-p2p/door-target'
          strings -a "$BIN" | grep -Fq '00000610'
          strings -a "$BIN" | grep -Fq '00000643'
          strings -a "$BIN" | grep -Fq 'R58_STOP_CLOSED=true'
          strings -a "$BIN" | grep -Fq 'R54_CALL_ADOPTION_STARTED=%s'

          SOURCE_SHA="$(sha256sum "$SRC" | awk '{print $1}')"
          BINARY_SHA="$(sha256sum "$BIN" | awk '{print $1}')"
          BINARY_SIZE="$(stat -c '%s' "$BIN")"
          {
            echo "source_sha=$SOURCE_SHA"
            echo "binary_sha=$BINARY_SHA"
            echo "binary_size=$BINARY_SIZE"
            echo "interpreter=$INTERPRETER"
            echo "needed=$NEEDED"
          } >> "$GITHUB_OUTPUT"

      - name: Promote binary and build metadata to branch
        env:
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          BINARY_SHA: ${{ steps.verify.outputs.binary_sha }}
          BINARY_SIZE: ${{ steps.verify.outputs.binary_size }}
          INTERPRETER: ${{ steps.verify.outputs.interpreter }}
          NEEDED: ${{ steps.verify.outputs.needed }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 755 .r63-build/comelit-v4-a custom_components/comelit/native/comelit-v4
          cat > safety-poc/research/media/v1/P116_R63_BUILD_INFO.txt <<EOF
          phase=P116_R63_GATE_PEER_TAP_ACTUATION
          source_sha256=$SOURCE_SHA
          native_binary_sha256=$BINARY_SHA
          native_binary_size=$BINARY_SIZE
          native_binary_mode=755
          interpreter=$INTERPRETER
          needed=$NEEDED
          reproducible_binary_cmp_gate=PASS
          musl_interpreter_gate=PASS
          no_glibc_dependency=PASS
          no_new_runtime_dependency=PASS
          entrance_bytes_unchanged=true
          gate_peer_target=00000610
          gate_output_index=1
          gate_write_count=5
          automatic_retry=false
          physical_effect_asserted=false
          candidate_executed=false
          production_deploy_performed=false
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/comelit/native/comelit-v4 \
            safety-poc/research/media/v1/P116_R63_BUILD_INFO.txt
          if git diff --cached --quiet; then
            echo 'No native promotion delta'
            exit 0
          fi
          git commit -m 'build(p116-r63): promote Gate-capable native binary'
          git push origin "HEAD:${GITHUB_REF_NAME}"
