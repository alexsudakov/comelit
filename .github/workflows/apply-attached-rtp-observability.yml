name: Apply attached RTP observability patch

on:
  push:
    branches:
      - feat/attached-rtp-observability
    paths:
      - .github/workflows/apply-attached-rtp-observability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attached-rtp-observability

      - name: Apply bounded observability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          h264 = "custom_components/comelit/h264_recovery.py"
          replace_once(
              h264,
              '''    def deactivate_output_port(self, port: int) -> bool:\n        for sink in self._sinks:\n            if sink.port != port:\n                continue\n            sink.active = False\n            return True\n        return False\n\n\nclass H264RecoveryRtpShim:\n''',
              '''    def deactivate_output_port(self, port: int) -> bool:\n        for sink in self._sinks:\n            if sink.port != port:\n                continue\n            sink.active = False\n            return True\n        return False\n\n    def input_rtp_diagnostics(self) -> dict[str, int | str | None]:\n        """Return bounded live timing/count diagnostics for the shim input."""\n        age_ms: int | None = None\n        if self._last_rtp_monotonic is not None:\n            age_ms = max(0, int((time.monotonic() - self._last_rtp_monotonic) * 1000))\n        return {\n            "input_packets": self._input_rtp_packets,\n            "first_rtp_at": self._first_rtp_at,\n            "last_rtp_at": self._last_rtp_at,\n            "last_rtp_age_ms": age_ms,\n        }\n\n\nclass H264RecoveryRtpShim:\n''',
          )
          replace_once(
              h264,
              '''    @property\n    def inactive_output_ports(self) -> tuple[int, ...]:\n        return self._inactive_output_ports\n\n    def diagnostics(self) -> RecoveryShimDiagnostics:\n''',
              '''    @property\n    def inactive_output_ports(self) -> tuple[int, ...]:\n        return self._inactive_output_ports\n\n    def input_rtp_diagnostics(self) -> dict[str, int | str | None]:\n        """Expose only bounded input RTP timing/count diagnostics."""\n        protocol = self._protocol\n        if protocol is None:\n            return {\n                "input_packets": 0,\n                "first_rtp_at": None,\n                "last_rtp_at": None,\n                "last_rtp_age_ms": None,\n            }\n        return protocol.input_rtp_diagnostics()\n\n    def diagnostics(self) -> RecoveryShimDiagnostics:\n''',
          )

          attached = "custom_components/comelit/attached_media.py"
          replace_once(
              attached,
              '''        self._lock = asyncio.Lock()\n        self._last_error: str | None = None\n\n    @property\n    def active(self) -> bool:\n''',
              '''        self._lock = asyncio.Lock()\n        self._last_error: str | None = None\n        self._last_video_observability: dict[str, object] = {}\n\n    @property\n    def active(self) -> bool:\n''',
          )
          replace_once(
              attached,
              '''    @property\n    def last_error(self) -> str | None:\n        return self._last_error\n\n    async def async_start(self, panel: str) -> None:\n''',
              '''    @property\n    def last_error(self) -> str | None:\n        return self._last_error\n\n    def video_observability_diagnostics(self) -> dict[str, object]:\n        """Expose bounded attached RTP evidence, retaining the last stopped session."""\n        shim = self._video_recovery_shim\n        if shim is None:\n            cached = dict(self._last_video_observability)\n            return {\n                "attached_video_shim_running": False,\n                "attached_video_input_packets": cached.get("input_packets", 0),\n                "attached_video_output_packets": cached.get("output_packets", 0),\n                "attached_video_first_rtp_at": cached.get("first_rtp_at"),\n                "attached_video_last_rtp_at": cached.get("last_rtp_at"),\n                "attached_video_last_rtp_age_ms": cached.get("last_rtp_age_ms"),\n                "attached_video_last_error": cached.get("last_error", self._last_error),\n            }\n\n        timing = shim.input_rtp_diagnostics()\n        recovery = shim.diagnostics()\n        return {\n            "attached_video_shim_running": recovery.running,\n            "attached_video_input_packets": timing["input_packets"],\n            "attached_video_output_packets": recovery.output_packets,\n            "attached_video_first_rtp_at": timing["first_rtp_at"],\n            "attached_video_last_rtp_at": timing["last_rtp_at"],\n            "attached_video_last_rtp_age_ms": timing["last_rtp_age_ms"],\n            "attached_video_last_error": recovery.last_error,\n        }\n\n    async def async_start(self, panel: str) -> None:\n''',
          )
          replace_once(
              attached,
              '''            self._last_error = None\n            shim = H264RecoveryRtpShim(\n''',
              '''            self._last_error = None\n            self._last_video_observability = {}\n            shim = H264RecoveryRtpShim(\n''',
          )
          replace_once(
              attached,
              '''            shim = self._video_recovery_shim\n            self._video_recovery_shim = None\n            self._active = False\n            if shim is not None:\n                await shim.async_stop()\n''',
              '''            shim = self._video_recovery_shim\n            if shim is not None:\n                timing = shim.input_rtp_diagnostics()\n                recovery = shim.diagnostics()\n                self._last_video_observability = {\n                    **timing,\n                    "output_packets": recovery.output_packets,\n                    "last_error": recovery.last_error,\n                }\n            self._video_recovery_shim = None\n            self._active = False\n            if shim is not None:\n                await shim.async_stop()\n''',
          )

          camera = "custom_components/comelit/camera.py"
          replace_once(
              camera,
              '''        attrs.update(self._transport.video_recovery_diagnostics())\n        attrs.update(self._transport.native_runtime_identity_diagnostics())\n''',
              '''        attrs.update(self._transport.video_recovery_diagnostics())\n        if self._attached_transport is not None:\n            attrs.update(self._attached_transport.video_observability_diagnostics())\n        attrs.update(self._transport.native_runtime_identity_diagnostics())\n''',
          )

          test = Path("safety-poc/tests/test_attached_rtp_observability_contract.py")
          test.write_text('''from pathlib import Path\nimport unittest\n\n\nROOT = Path(__file__).resolve().parents[2]\n\n\nclass AttachedRtpObservabilityContractTests(unittest.TestCase):\n    def test_h264_shim_exposes_bounded_input_timing(self) -> None:\n        text = (ROOT / "custom_components/comelit/h264_recovery.py").read_text(encoding="utf-8")\n        self.assertIn("def input_rtp_diagnostics", text)\n        self.assertIn('"first_rtp_at": self._first_rtp_at', text)\n        self.assertIn('"last_rtp_at": self._last_rtp_at', text)\n        self.assertIn('"last_rtp_age_ms": age_ms', text)\n\n    def test_attached_transport_retains_last_stopped_session(self) -> None:\n        text = (ROOT / "custom_components/comelit/attached_media.py").read_text(encoding="utf-8")\n        self.assertIn("self._last_video_observability", text)\n        self.assertIn('"attached_video_input_packets"', text)\n        self.assertIn('"attached_video_last_rtp_at"', text)\n        self.assertIn('"attached_video_last_rtp_age_ms"', text)\n        capture = text.index("timing = shim.input_rtp_diagnostics()")\n        clear = text.index("self._video_recovery_shim = None", capture)\n        self.assertLess(capture, clear)\n\n    def test_camera_publishes_attached_observability(self) -> None:\n        text = (ROOT / "custom_components/comelit/camera.py").read_text(encoding="utf-8")\n        self.assertIn("self._attached_transport.video_observability_diagnostics()", text)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")
          PY

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest safety-poc/tests/test_attached_rtp_observability_contract.py
          python3 -m compileall -q custom_components/comelit

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/comelit/h264_recovery.py custom_components/comelit/attached_media.py custom_components/comelit/camera.py safety-poc/tests/test_attached_rtp_observability_contract.py
          git diff --cached --check
          git commit -m "feat(diagnostics): expose attached RTP last-packet evidence"
          git push origin HEAD:feat/attached-rtp-observability
