name: run staged runtime hardening patch

on:
  push:
    branches:
      - fix/runtime-reliability-security-hardening

permissions:
  contents: write

jobs:
  apply-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect generated hardening commit
        id: generated
        shell: bash
        run: |
          if git log -1 --format=%s | grep -Fq '[hardening-generated]'; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Generated hardening commit already present; verification-only run.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Extract and apply staged hardening patch
        if: steps.generated.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/self-apply-runtime-hardening.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('staged patch markers are not unique')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          target = Path('/tmp/apply_runtime_hardening.py')
          target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          compile(target.read_text(encoding='utf-8'), str(target), 'exec')
          PY
          python3 /tmp/apply_runtime_hardening.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('safety-poc/tests/test_runtime_reliability_hardening.py')
          text = p.read_text(encoding='utf-8')
          old = '        close = text[text.index("async def _async_close_unlocked"):text.index("async def async_record_mp4")]\n'
          new = (
              '        provider_start = text.index("class HAStreamMediaProvider:")\n'
              '        close_start = text.index("async def _async_close_unlocked", provider_start)\n'
              '        record_start = text.index("async def async_record_mp4", close_start)\n'
              '        close = text[close_start:record_start]\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one stream-test scope line, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Diff check
        if: steps.generated.outputs.present != 'true'
        run: git diff --check

      - name: Compile integration
        if: steps.generated.outputs.present != 'true'
        run: python3 -m compileall -q custom_components/comelit

      - name: Static safety check
        if: steps.generated.outputs.present != 'true'
        run: cd safety-poc && python3 scripts/static_safety_check.py

      - name: Frontend syntax check
        if: steps.generated.outputs.present != 'true'
        run: node --check custom_components/comelit/frontend/comelit-card.js

      - name: Hardening regression contract
        if: steps.generated.outputs.present != 'true'
        run: python3 -m unittest safety-poc/tests/test_runtime_reliability_hardening.py -v

      - name: Full safety-poc unit suite
        if: steps.generated.outputs.present != 'true'
        shell: bash
        run: |
          set -o pipefail
          cd safety-poc
          PYTHONPATH="$PWD/src" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/full-safety-suite.log

      - name: Upload full-suite diagnostics
        if: always() && steps.generated.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-safety-suite-log
          path: /tmp/full-safety-suite.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Install Mini App test dependencies
        if: steps.generated.outputs.present != 'true'
        run: python3 -m pip install -q pytest cryptography

      - name: Mini App Python tests
        if: steps.generated.outputs.present != 'true'
        run: pytest -q tests/miniapp

      - name: Production negative controls
        if: steps.generated.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          find custom_components/comelit -type d -name __pycache__ -prune -exec rm -rf {} +
          test ! -e custom_components/comelit/test_control.py
          ! grep -R --exclude='*.pyc' --exclude-dir='__pycache__' "child_env = os.environ.copy()" -n custom_components/comelit
          ! grep -R --exclude='*.pyc' --exclude-dir='__pycache__' "async_register_test_control" -n custom_components/comelit

      - name: Commit verified generated code
        if: steps.generated.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alexsudakov"
          git config user.email "91778685+alexsudakov@users.noreply.github.com"
          git add custom_components/comelit safety-poc/tests/test_runtime_reliability_hardening.py
          git diff --cached --check
          git commit -m "fix(runtime): harden listener lifecycle and production safety [hardening-generated]"
          git push origin HEAD:fix/runtime-reliability-security-hardening
