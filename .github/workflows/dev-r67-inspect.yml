name: dev-r67-inspect
on:
  push:
    branches:
      - fix/pr281-attached-refresh-terminal
    paths:
      - .github/workflows/dev-r67-inspect.yml
      - safety-poc/research/media/v1/entrance_p116_r66_call_time_door_transform.py

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current R66 listener source
        shell: bash
        run: |
          set -euo pipefail
          MEDIA=safety-poc/research/media/v1
          SOURCE=safety-poc/research/door/v1_5_7/comelit-v4-persistent-ctpp-door.c
          OUT="$MEDIA/_dev_r66_generated.c"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$MEDIA" python3 "$MEDIA/entrance_p116_r66_call_time_door_transform.py" --source "$SOURCE" --output "$OUT"
          sha256sum "$OUT"
          grep -n -E 'P76_|p76_|0x001A|0x001a|001A|001a|R42_ATTACHED_MEDIA_ACTIVE|P12_TX_R42_MEDIA|r58_stop_writer' "$OUT" || true
      - name: Commit generated inspection source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add safety-poc/research/media/v1/_dev_r66_generated.c
          git commit -m 'chore(dev): persist generated R66 listener [skip ci]'
          git push origin HEAD:fix/pr281-attached-refresh-terminal
