name: self-apply runtime hardening

on:
  push:
    branches:
      - fix/runtime-reliability-security-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_tail(path: str, marker: str, new_tail: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit(f'{path}: tail marker not found: {marker!r}')
              p.write_text(text[:idx] + new_tail, encoding='utf-8')

          # -----------------------------------------------------------------
          # runtime.py: architecture gate, environment allowlist, call-state
          # watchdog, reader-task supervision, bounded parser/reject handling.
          # -----------------------------------------------------------------
          replace_once(
              'custom_components/comelit/runtime.py',
              'import os\nfrom pathlib import Path\nimport re\n',
              'import os\nfrom pathlib import Path\nimport platform\nimport re\n',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '_DOOR_LOG_STAGE_RE = re.compile(r"^[A-Z][A-Z0-9_]{0,47}$")\n_DOOR_LOG_WRITE_RE = re.compile(\n',
              '_DOOR_LOG_STAGE_RE = re.compile(r"^[A-Z][A-Z0-9_]{0,47}$")\n_NATIVE_ENV_PASSTHROUGH = frozenset({"HOME", "LANG", "LC_ALL", "TZ", "SSL_CERT_FILE", "SSL_CERT_DIR"})\n_SUPPORTED_NATIVE_ARCHITECTURES = frozenset({"x86_64", "amd64"})\n_CALL_STATE_TIMEOUT_SECONDS = 120.0\n_DOOR_LOG_WRITE_RE = re.compile(\n',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              'def _native_gate() -> None:\n    if not _NATIVE_BINARY.is_file():\n',
              '''def _native_child_env() -> dict[str, str]:\n    env = {\n        "LD_LIBRARY_PATH": str(_NATIVE_LIB),\n        "PATH": os.environ.get(\n            "PATH",\n            "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",\n        ),\n    }\n    for key in _NATIVE_ENV_PASSTHROUGH:\n        value = os.environ.get(key)\n        if value:\n            env[key] = value\n    return env\n\n\ndef _native_gate() -> None:\n    if platform.machine().lower() not in _SUPPORTED_NATIVE_ARCHITECTURES:\n        raise ComelitRingRuntimeError("unsupported_native_architecture")\n    if not _NATIVE_BINARY.is_file():\n''',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '        self._call_state = ComelitCallStateTracker()\n',
              '        self._call_state = ComelitCallStateTracker()\n        self._call_state_timeout_task: asyncio.Task[None] | None = None\n',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''        return tracker\n\n    def call_status(self) -> dict[str, object]:\n''',
              '''        return tracker\n\n    def _cancel_call_state_timeout(self) -> None:\n        task = getattr(self, "_call_state_timeout_task", None)\n        if task is not None and not task.done():\n            task.cancel()\n        self._call_state_timeout_task = None\n\n    def _schedule_call_state_timeout(self, event_id: str) -> None:\n        self._cancel_call_state_timeout()\n        self._call_state_timeout_task = self._entry.async_create_background_task(\n            self._hass,\n            self._async_expire_call_state(event_id),\n            "comelit call-state watchdog",\n        )\n\n    async def _async_expire_call_state(self, event_id: str) -> None:\n        current = asyncio.current_task()\n        try:\n            await asyncio.sleep(_CALL_STATE_TIMEOUT_SECONDS)\n            snapshot = self._call_state_tracker().snapshot()\n            if snapshot.event_id != event_id:\n                return\n            if self._call_state_tracker().fail_active("call_state_timeout"):\n                _LOGGER.warning(\n                    "Comelit call-state watchdog expired after %ss; "\n                    "remote release was not observed",\n                    int(_CALL_STATE_TIMEOUT_SECONDS),\n                )\n                self._notify_status()\n        except asyncio.CancelledError:\n            return\n        finally:\n            if getattr(self, "_call_state_timeout_task", None) is current:\n                self._call_state_timeout_task = None\n\n    def call_status(self) -> dict[str, object]:\n''',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '            "last_error": snapshot.last_error,\n        }\n',
              '            "last_error": snapshot.last_error,\n            "state_timeout_seconds": int(_CALL_STATE_TIMEOUT_SECONDS),\n        }\n',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''                and self._call_state_tracker().begin(\n                    panel=panel,\n                    event_id=event_id,\n                    started_at=started_at,\n                )\n            ):\n                self._notify_status()\n''',
              '''            ):\n                changed = self._call_state_tracker().begin(\n                    panel=panel,\n                    event_id=event_id,\n                    started_at=started_at,\n                )\n                self._schedule_call_state_timeout(event_id)\n                if changed:\n                    self._notify_status()\n''',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '        self._media_diagnostics.reset()\n        self._call_state_tracker().reset()\n',
              '        self._media_diagnostics.reset()\n        self._cancel_call_state_timeout()\n        self._call_state_tracker().reset()\n',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '    async def async_stop(self) -> None:\n        self._stopping = True\n',
              '    async def async_stop(self) -> None:\n        self._stopping = True\n        self._cancel_call_state_timeout()\n',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''        finally:\n            if (\n                not self._stopping\n''',
              '''        finally:\n            self._cancel_call_state_timeout()\n            if (\n                not self._stopping\n''',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''        child_env = os.environ.copy()\n        child_env["LD_LIBRARY_PATH"] = str(_NATIVE_LIB)\n''',
              '        child_env = _native_child_env()\n',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''            rc = await process.wait()\n            await reader_task\n            if rc != 0 and not self._stopping:\n                self._capture_native_failure(rc)\n                raise ComelitRingRuntimeError(f"native_exit:{rc}")\n''',
              '''            process_completion = asyncio.create_task(\n                process.wait(),\n                name="wait Comelit ring helper",\n            )\n            done, _ = await asyncio.wait(\n                {process_completion, reader_task},\n                return_when=asyncio.FIRST_COMPLETED,\n            )\n            if reader_task in done and process_completion not in done:\n                reader_error = reader_task.exception()\n                if reader_error is not None:\n                    raise ComelitRingRuntimeError(\n                        f"native_reader_failed:{type(reader_error).__name__}"\n                    ) from reader_error\n                try:\n                    rc = await asyncio.wait_for(\n                        asyncio.shield(process_completion),\n                        timeout=0.5,\n                    )\n                except TimeoutError as exc:\n                    raise ComelitRingRuntimeError("native_reader_stopped") from exc\n            else:\n                rc = await process_completion\n\n            try:\n                await asyncio.wait_for(asyncio.shield(reader_task), timeout=2.0)\n            except TimeoutError as exc:\n                raise ComelitRingRuntimeError("native_reader_stuck_after_exit") from exc\n            except asyncio.CancelledError:\n                raise\n            except Exception as exc:\n                if rc == 0:\n                    raise ComelitRingRuntimeError(\n                        f"native_reader_failed:{type(exc).__name__}"\n                    ) from exc\n                _LOGGER.warning(\n                    "Comelit ring output reader failed while native exited; "\n                    "reader_failure=%s rc=%s",\n                    type(exc).__name__,\n                    rc,\n                )\n            if rc != 0 and not self._stopping:\n                self._capture_native_failure(rc)\n                raise ComelitRingRuntimeError(f"native_exit:{rc}")\n''',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''            if line in {\n                "R37_REMOTE_RELEASE_OBSERVED=true",\n                "R64_POST_CALL_REMOTE_RELEASE_OBSERVED=true",\n                "R64_TERMINAL_REMOTE_RELEASE_OBSERVED=true",\n            }:\n                if self._call_state_tracker().remote_release():\n                    self._notify_status()\n''',
              '''            if line in {\n                "R37_REMOTE_RELEASE_OBSERVED=true",\n                "R64_POST_CALL_REMOTE_RELEASE_OBSERVED=true",\n                "R64_TERMINAL_REMOTE_RELEASE_OBSERVED=true",\n            }:\n                self._cancel_call_state_timeout()\n                if self._call_state_tracker().remote_release():\n                    self._notify_status()\n''',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''            if line.startswith("V4_DOOR_REJECT_STAGE="):\n                self._door_diagnostic["reject_stage"] = (\n                    line.split("=", 1)[1]\n                )\n                continue\n''',
              '''            if line.startswith("V4_DOOR_REJECT_STAGE="):\n                reject_stage = line.split("=", 1)[1]\n                if _DOOR_LOG_STAGE_RE.fullmatch(reject_stage):\n                    self._door_diagnostic["reject_stage"] = reject_stage\n                else:\n                    _LOGGER.warning(\n                        "Ignoring malformed Comelit Door reject stage"\n                    )\n                continue\n''',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''            self._ring_lines.append(line)\n            present = {item.split("=", 1)[0] for item in self._ring_lines}\n''',
              '''            if line == "V4_RING_OBSERVED=true":\n                self._ring_lines.clear()\n            self._ring_lines.append(line)\n            present = {item.split("=", 1)[0] for item in self._ring_lines}\n''',
          )
          replace_once(
              'custom_components/comelit/runtime.py',
              '''            try:\n                ring = parse_v4_safe_ring(batch)\n            except RingObservationError as exc:\n                raise ComelitRingRuntimeError(f"ring_contract:{exc}") from exc\n\n            if ring is None:\n''',
              '''            try:\n                ring = parse_v4_safe_ring(batch)\n            except RingObservationError as exc:\n                _LOGGER.warning(\n                    "Ignoring malformed Comelit ring observation: %s",\n                    type(exc).__name__,\n                )\n                continue\n\n            if ring is None:\n''',
          )

          # -----------------------------------------------------------------
          # call_state.py: bounded stale-ringing containment. This does not
          # tear down media or assert that the remote call ended; it moves the
          # user-facing state to ERROR after 120s without authoritative release.
          # -----------------------------------------------------------------
          replace_once(
              'custom_components/comelit/call_state.py',
              '''        "listener_failure",\n        "listener_stopped_during_call",\n''',
              '''        "listener_failure",\n        "listener_stopped_during_call",\n        "call_state_timeout",\n''',
          )

          # -----------------------------------------------------------------
          # media_transport.py: same environment/architecture hardening and
          # supervision once the media helper is ACTIVE.
          # -----------------------------------------------------------------
          replace_once(
              'custom_components/comelit/media_transport.py',
              'import os\nfrom pathlib import Path\nimport re\n',
              'import os\nfrom pathlib import Path\nimport platform\nimport re\n',
          )
          replace_once(
              'custom_components/comelit/media_transport.py',
              '_HEX32_RE = re.compile(r"^[0-9A-Fa-f]{32}$")\n',
              '_HEX32_RE = re.compile(r"^[0-9A-Fa-f]{32}$")\n_NATIVE_ENV_PASSTHROUGH = frozenset({"HOME", "LANG", "LC_ALL", "TZ", "SSL_CERT_FILE", "SSL_CERT_DIR"})\n_SUPPORTED_NATIVE_ARCHITECTURES = frozenset({"x86_64", "amd64"})\n',
          )
          replace_once(
              'custom_components/comelit/media_transport.py',
              'def _native_gate() -> None:\n    if not _MEDIA_NATIVE_BINARY.is_file():\n',
              '''def _native_child_env() -> dict[str, str]:\n    env = {\n        "LD_LIBRARY_PATH": str(_NATIVE_LIB),\n        "PATH": os.environ.get(\n            "PATH",\n            "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",\n        ),\n    }\n    for key in _NATIVE_ENV_PASSTHROUGH:\n        value = os.environ.get(key)\n        if value:\n            env[key] = value\n    return env\n\n\ndef _native_gate() -> None:\n    if platform.machine().lower() not in _SUPPORTED_NATIVE_ARCHITECTURES:\n        raise ComelitMediaTransportError("unsupported_native_architecture")\n    if not _MEDIA_NATIVE_BINARY.is_file():\n''',
          )
          replace_once(
              'custom_components/comelit/media_transport.py',
              '''        child_env = os.environ.copy()\n        child_env["LD_LIBRARY_PATH"] = str(_NATIVE_LIB)\n''',
              '        child_env = _native_child_env()\n',
          )
          replace_once(
              'custom_components/comelit/media_transport.py',
              '''            rc = await process.wait()\n            reader = self._reader_task\n            if reader is not None:\n                await reader\n            if self._stopping:\n                self._emit_native_success_summary()\n            if not self._stopping:\n                self._capture_native_failure(rc)\n                raise ComelitMediaTransportError(f"media_native_exit:{rc}")\n''',
              '''            process_completion = asyncio.create_task(\n                process.wait(),\n                name="wait Comelit media helper",\n            )\n            reader = self._reader_task\n            if reader is None:\n                raise ComelitMediaTransportError("media_native_reader_missing")\n            done, _ = await asyncio.wait(\n                {process_completion, reader},\n                return_when=asyncio.FIRST_COMPLETED,\n            )\n            if reader in done and process_completion not in done:\n                reader_error = reader.exception()\n                if reader_error is not None:\n                    raise ComelitMediaTransportError(\n                        f"media_native_reader_failed:{type(reader_error).__name__}"\n                    ) from reader_error\n                try:\n                    rc = await asyncio.wait_for(\n                        asyncio.shield(process_completion),\n                        timeout=0.5,\n                    )\n                except TimeoutError as exc:\n                    raise ComelitMediaTransportError(\n                        "media_native_reader_stopped"\n                    ) from exc\n            else:\n                rc = await process_completion\n            try:\n                await asyncio.wait_for(asyncio.shield(reader), timeout=2.0)\n            except TimeoutError as exc:\n                raise ComelitMediaTransportError(\n                    "media_native_reader_stuck_after_exit"\n                ) from exc\n            except asyncio.CancelledError:\n                raise\n            except Exception as exc:\n                if rc == 0:\n                    raise ComelitMediaTransportError(\n                        f"media_native_reader_failed:{type(exc).__name__}"\n                    ) from exc\n                _LOGGER.warning(\n                    "Comelit media output reader failed while native exited; "\n                    "reader_failure=%s rc=%s",\n                    type(exc).__name__,\n                    rc,\n                )\n            if self._stopping:\n                self._emit_native_success_summary()\n            if not self._stopping:\n                self._capture_native_failure(rc)\n                raise ComelitMediaTransportError(f"media_native_exit:{rc}")\n''',
          )

          # -----------------------------------------------------------------
          # OAuth: identify invalid_grant without logging body/token material,
          # start Home Assistant reauth once, and let supervisor stop reconnects.
          # -----------------------------------------------------------------
          replace_once(
              'custom_components/comelit/oauth.py',
              '''class ComelitOAuthError(RuntimeError):\n    """Comelit OAuth refresh failed without exposing token material."""\n\n\n@dataclass(frozen=True)\n''',
              '''class ComelitOAuthError(RuntimeError):\n    """Comelit OAuth refresh failed without exposing token material."""\n\n\nclass ComelitOAuthReauthRequired(ComelitOAuthError):\n    """The stored refresh grant is no longer usable and requires reauth."""\n\n\n@dataclass(frozen=True)\n''',
          )
          replace_once(
              'custom_components/comelit/oauth.py',
              '''    if not 200 <= status < 300:\n        raise ComelitOAuthError(f"oauth_http_status:{status}")\n\n    try:\n        obj = json.loads(raw.decode("utf-8", errors="replace"))\n''',
              '''    if not 200 <= status < 300:\n        try:\n            error_obj = json.loads(raw.decode("utf-8", errors="replace"))\n        except (UnicodeError, json.JSONDecodeError):\n            error_obj = None\n        if (\n            isinstance(error_obj, dict)\n            and error_obj.get("error") == "invalid_grant"\n        ):\n            raise ComelitOAuthReauthRequired("oauth_reauth_required")\n        raise ComelitOAuthError(f"oauth_http_status:{status}")\n\n    try:\n        obj = json.loads(raw.decode("utf-8", errors="replace"))\n''',
          )
          replace_once(
              'custom_components/comelit/oauth.py',
              '''            refreshed = await async_refresh_oauth(\n                self._session,\n                refresh_token=refresh,\n                scope=scope,\n            )\n''',
              '''            try:\n                refreshed = await async_refresh_oauth(\n                    self._session,\n                    refresh_token=refresh,\n                    scope=scope,\n                )\n            except ComelitOAuthReauthRequired:\n                self._entry.async_start_reauth(self._hass)\n                raise\n''',
          )

          # -----------------------------------------------------------------
          # Config-flow reauth: replace only OAuth tokens/scope, preserving
          # device UUID, ViP token and all unrelated entry data.
          # -----------------------------------------------------------------
          replace_once(
              'custom_components/comelit/config_flow.py',
              '''    CONF_OAUTH_ACCESS_TOKEN,\n    CONF_OAUTH_REFRESH_TOKEN,\n''',
              '''    CONF_OAUTH_ACCESS_TOKEN,\n    CONF_OAUTH_EXPIRES_AT,\n    CONF_OAUTH_REFRESH_TOKEN,\n''',
          )
          marker = '\n\nclass ComelitOptionsFlow(config_entries.OptionsFlow):\n'
          p = ROOT / 'custom_components/comelit/config_flow.py'
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('config_flow.py: options-flow marker mismatch')
          reauth_methods = '''\n    async def async_step_reauth(\n        self, entry_data: dict[str, Any]\n    ):\n        """Start reauthentication after an OAuth invalid_grant."""\n        return await self.async_step_reauth_confirm()\n\n    async def async_step_reauth_confirm(\n        self, user_input: dict[str, Any] | None = None\n    ):\n        """Replace only OAuth credentials and reload the existing entry."""\n        errors: dict[str, str] = {}\n        entry = self._get_reauth_entry()\n        if user_input is not None:\n            try:\n                access = _clean_required(user_input[CONF_OAUTH_ACCESS_TOKEN])\n                refresh = str(\n                    user_input.get(CONF_OAUTH_REFRESH_TOKEN) or ""\n                ).strip()\n                scope = str(user_input.get(CONF_OAUTH_SCOPE) or "").strip()\n            except (ValueError, KeyError):\n                errors["base"] = "invalid_config"\n            else:\n                data = dict(entry.data)\n                data[CONF_OAUTH_ACCESS_TOKEN] = access\n                if refresh:\n                    data[CONF_OAUTH_REFRESH_TOKEN] = refresh\n                else:\n                    data.pop(CONF_OAUTH_REFRESH_TOKEN, None)\n                if scope:\n                    data[CONF_OAUTH_SCOPE] = scope\n                else:\n                    data.pop(CONF_OAUTH_SCOPE, None)\n                data.pop(CONF_OAUTH_EXPIRES_AT, None)\n                return self.async_update_reload_and_abort(entry, data=data)\n\n        schema = vol.Schema(\n            {\n                vol.Required(CONF_OAUTH_ACCESS_TOKEN): TextSelector(\n                    TextSelectorConfig(type=TextSelectorType.PASSWORD)\n                ),\n                vol.Optional(CONF_OAUTH_REFRESH_TOKEN): TextSelector(\n                    TextSelectorConfig(type=TextSelectorType.PASSWORD)\n                ),\n                vol.Optional(\n                    CONF_OAUTH_SCOPE,\n                    default=str(entry.data.get(CONF_OAUTH_SCOPE) or ""),\n                ): TextSelector(TextSelectorConfig(type=TextSelectorType.TEXT)),\n            }\n        )\n        return self.async_show_form(\n            step_id="reauth_confirm",\n            data_schema=schema,\n            errors=errors,\n        )\n'''
          text = text.replace(marker, reauth_methods + marker, 1)
          p.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # Supervisor: exponential bounded backoff for repeated failures and
          # stop reconnecting after OAuth reauth has been requested.
          # -----------------------------------------------------------------
          replace_once(
              'custom_components/comelit/supervisor.py',
              'RECONNECT_DELAY_SECONDS = 5\nPOLL_INTERVAL_SECONDS = 1\n',
              'RECONNECT_INITIAL_DELAY_SECONDS = 5\nRECONNECT_MAX_DELAY_SECONDS = 300\nRECONNECT_NORMAL_DELAY_SECONDS = 1\nPOLL_INTERVAL_SECONDS = 1\n',
          )
          replace_once(
              'custom_components/comelit/supervisor.py',
              '        self._reconnect_count = 0\n        self._state = LISTENER_STATE_STOPPED\n',
              '        self._reconnect_count = 0\n        self._consecutive_failures = 0\n        self._reconnect_delay_seconds = 0\n        self._state = LISTENER_STATE_STOPPED\n',
          )
          replace_once(
              'custom_components/comelit/supervisor.py',
              '''            "reconnect_count": self._reconnect_count,\n            "last_ready": self._last_ready.isoformat() if self._last_ready else None,\n''',
              '''            "reconnect_count": self._reconnect_count,\n            "consecutive_failures": self._consecutive_failures,\n            "reconnect_delay_seconds": self._reconnect_delay_seconds,\n            "last_ready": self._last_ready.isoformat() if self._last_ready else None,\n''',
          )
          replace_once(
              'custom_components/comelit/supervisor.py',
              '''    def _set_state(self, state: str) -> None:\n        if state == self._state:\n            return\n        self._state = state\n        if state == LISTENER_STATE_READY:\n            self._last_ready = datetime.now(UTC)\n''',
              '''    def _set_state(self, state: str) -> None:\n        if state == LISTENER_STATE_READY:\n            self._consecutive_failures = 0\n            self._reconnect_delay_seconds = 0\n        if state == self._state:\n            return\n        self._state = state\n        if state == LISTENER_STATE_READY:\n            self._last_ready = datetime.now(UTC)\n''',
          )
          replace_once(
              'custom_components/comelit/supervisor.py',
              '''                if runtime_status.get("last_error"):\n                    self._set_state(LISTENER_STATE_ERROR)\n                else:\n                    self._set_state(LISTENER_STATE_RECONNECTING)\n                # reconnect_count may change even when the visible state does not.\n                self._notify_status()\n\n                _LOGGER.warning("RECONNECT_ATTEMPT=%s", self._reconnect_count)\n                _LOGGER.warning("RECONNECT_REASON=%s", reconnect_reason)\n                _LOGGER.warning(\n                    "Comelit listener cycle ended; reconnecting in %ss (count=%s)",\n                    RECONNECT_DELAY_SECONDS,\n                    self._reconnect_count,\n                )\n                await asyncio.sleep(RECONNECT_DELAY_SECONDS)\n''',
              '''                if last_error == "oauth_reauth_required":\n                    self._set_state(LISTENER_STATE_ERROR)\n                    self._reconnect_delay_seconds = 0\n                    self._notify_status()\n                    _LOGGER.error(\n                        "Comelit listener requires OAuth reauthentication; "\n                        "automatic reconnect stopped"\n                    )\n                    return\n\n                if runtime_status.get("last_error"):\n                    self._set_state(LISTENER_STATE_ERROR)\n                    self._consecutive_failures += 1\n                    self._reconnect_delay_seconds = min(\n                        RECONNECT_INITIAL_DELAY_SECONDS\n                        * (2 ** max(0, self._consecutive_failures - 1)),\n                        RECONNECT_MAX_DELAY_SECONDS,\n                    )\n                else:\n                    self._set_state(LISTENER_STATE_RECONNECTING)\n                    self._consecutive_failures = 0\n                    self._reconnect_delay_seconds = RECONNECT_NORMAL_DELAY_SECONDS\n                # reconnect_count/delay may change even when visible state does not.\n                self._notify_status()\n\n                _LOGGER.warning("RECONNECT_ATTEMPT=%s", self._reconnect_count)\n                _LOGGER.warning("RECONNECT_REASON=%s", reconnect_reason)\n                _LOGGER.warning(\n                    "Comelit listener cycle ended; reconnecting in %ss (count=%s)",\n                    self._reconnect_delay_seconds,\n                    self._reconnect_count,\n                )\n                await asyncio.sleep(self._reconnect_delay_seconds)\n''',
          )

          # Surface backoff in diagnostic sensor.
          replace_once(
              'custom_components/comelit/sensor.py',
              '''            "reconnect_count": status["reconnect_count"],\n            "last_ready": status["last_ready"],\n''',
              '''            "reconnect_count": status["reconnect_count"],\n            "consecutive_failures": status.get("consecutive_failures"),\n            "reconnect_delay_seconds": status.get("reconnect_delay_seconds"),\n            "last_ready": status["last_ready"],\n''',
