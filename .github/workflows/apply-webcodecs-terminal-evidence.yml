name: Apply WebCodecs terminal evidence patch

on:
  push:
    branches:
      - fix/webcodecs-source-terminal-evidence
    paths:
      - .github/workflows/apply-webcodecs-terminal-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webcodecs-source-terminal-evidence
          fetch-depth: 0
      - name: Apply exact patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('custom_components/comelit/miniapp/webcodecs.py')
          s = p.read_text(encoding='utf-8')
          old = '''                    packet = next(iterator, None)\n                    if packet is None:\n                        future.set_result(None)\n                        current_future = None\n                        continue\n'''
          new = '''                    packet = next(iterator, None)\n                    if packet is None:\n                        _LOGGER.info(\n                            "COMELIT_MINIAPP_WEBCODECS_SOURCE_TERMINAL "\n                            "terminal_cause=source_eof"\n                        )\n                        future.set_result(None)\n                        current_future = None\n                        continue\n'''
          if old not in s:
              raise SystemExit('EOF anchor mismatch')
          s = s.replace(old, new, 1)

          old = '''                except Exception as exc:\n                    future.set_exception(exc)\n                    current_future = None\n'''
          new = '''                except Exception as exc:\n                    _LOGGER.info(\n                        "COMELIT_MINIAPP_WEBCODECS_SOURCE_TERMINAL "\n                        "terminal_cause=source_transport_closed:%s",\n                        type(exc).__name__,\n                    )\n                    future.set_exception(exc)\n                    current_future = None\n'''
          if old not in s:
              raise SystemExit('exception anchor mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          Path('safety-poc/tests/test_webcodecs_source_terminal_evidence.py').write_text('''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[2]\n\nclass WebCodecsSourceTerminalEvidenceTests(unittest.TestCase):\n    def test_source_terminal_reason_is_bounded_and_classified(self) -> None:\n        text = (ROOT / "custom_components/comelit/miniapp/webcodecs.py").read_text(encoding="utf-8")\n        self.assertIn("COMELIT_MINIAPP_WEBCODECS_SOURCE_TERMINAL", text)\n        self.assertIn("terminal_cause=source_eof", text)\n        self.assertIn("terminal_cause=source_transport_closed:%s", text)\n        self.assertIn("type(exc).__name__", text)\n\n    def test_raw_exception_text_is_not_logged(self) -> None:\n        text = (ROOT / "custom_components/comelit/miniapp/webcodecs.py").read_text(encoding="utf-8")\n        start = text.index("packet = next(iterator, None)")\n        end = text.index("future.set_exception(exc)", start) + len("future.set_exception(exc)")\n        block = text[start:end]\n        self.assertNotIn("str(exc)", block)\n        self.assertNotIn("repr(exc)", block)\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

          python3 -m compileall -q custom_components/comelit
          python3 safety-poc/tests/test_webcodecs_source_terminal_evidence.py
          git rm .github/workflows/apply-webcodecs-terminal-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/comelit/miniapp/webcodecs.py safety-poc/tests/test_webcodecs_source_terminal_evidence.py
          git commit -m 'feat(diagnostics): classify WebCodecs source termination'
          git push origin HEAD:fix/webcodecs-source-terminal-evidence
