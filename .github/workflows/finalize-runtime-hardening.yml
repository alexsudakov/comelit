name: finalize runtime hardening

on:
  push:
    branches:
      - fix/runtime-reliability-security-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply regression-aligned corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'custom_components/comelit/ring_media.py',
              '''    async def _async_close_unlocked(self) -> None:\n        stream = self._stream\n        if stream is not None and hasattr(stream, "stop"):\n            await stream.stop()\n''',
              '''    async def _async_close_unlocked(self) -> None:\n        stream = self._stream\n        self._stream = None\n        if stream is None:\n            return\n        if hasattr(stream, "stop"):\n            await stream.stop()\n        stream_domain = self._hass.data.get(STREAM_DOMAIN, {})\n        streams = stream_domain.get(ATTR_STREAMS)\n        if isinstance(streams, list):\n            try:\n                streams.remove(stream)\n            except ValueError:\n                pass\n''',
          )

          replace_once(
              'safety-poc/tests/test_mvp1_synthetic_ring_control.py',
              '''    def test_synthetic_trigger_stays_on_local_restricted_test_control(self) -> None:\n        source = TEST_CONTROL.read_text(encoding="utf-8")\n        self.assertIn('_ALLOWED_REMOTE = "192.168.1.85"', source)\n        self.assertIn('if action == "simulate_entrance_ring":', source)\n        self.assertIn("await runtime.async_simulate_entrance_ring()", source)\n        self.assertIn("local_only=True", source)\n        self.assertIn('result["synthetic"] = True', source)\n''',
              '''    def test_synthetic_trigger_is_not_shipped_as_production_test_control(self) -> None:\n        self.assertFalse(TEST_CONTROL.exists())\n''',
          )

          replace_once(
              'safety-poc/tests/test_p14_ha_custom_component_contract.py',
              '''    def test_production_supervisor_autostarts_and_never_invokes_door(self):\n        init = (ROOT / "custom_components/comelit/__init__.py").read_text()\n        supervisor = (ROOT / "custom_components/comelit/supervisor.py").read_text()\n        test_control = (ROOT / "custom_components/comelit/test_control.py").read_text()\n        self.assertIn("await supervisor.async_start()", init)\n        self.assertIn("ComelitRuntimeSupervisor", init)\n        self.assertIn("RECONNECT_DELAY_SECONDS = 5", supervisor)\n        self.assertIn("await self._runtime.async_start()", supervisor)\n        self.assertIn("await self._runtime.async_stop()", supervisor)\n        self.assertIn("async def async_open_entrance_door", supervisor)\n        self.assertIn("async def async_open_gate_door", supervisor)\n        self.assertNotIn("for attempt", supervisor)\n        self.assertIn("await supervisor.async_stop()", test_control)\n        self.assertIn('status["supervisor_running"]', test_control)\n''',
              '''    def test_production_supervisor_autostarts_and_never_invokes_door(self):\n        init = (ROOT / "custom_components/comelit/__init__.py").read_text()\n        supervisor = (ROOT / "custom_components/comelit/supervisor.py").read_text()\n        self.assertIn("await supervisor.async_start()", init)\n        self.assertIn("ComelitRuntimeSupervisor", init)\n        self.assertIn("RECONNECT_INITIAL_DELAY_SECONDS = 5", supervisor)\n        self.assertIn("RECONNECT_MAX_DELAY_SECONDS = 300", supervisor)\n        self.assertIn("await self._runtime.async_start()", supervisor)\n        self.assertIn("await self._runtime.async_stop()", supervisor)\n        self.assertIn("async def async_open_entrance_door", supervisor)\n        self.assertIn("async def async_open_gate_door", supervisor)\n        self.assertNotIn("for attempt", supervisor)\n        self.assertFalse((ROOT / "custom_components/comelit/test_control.py").exists())\n''',
          )

          replace_once(
              'safety-poc/tests/test_p116_r59_post_call_pseudotcp_lifecycle.py',
              '''            with mock.patch.object(module, "RECONNECT_DELAY_SECONDS", 0.05), mock.patch.object(\n                module, "POLL_INTERVAL_SECONDS", 0.01\n            ):\n''',
              '''            with mock.patch.object(\n                module, "RECONNECT_INITIAL_DELAY_SECONDS", 0.05\n            ), mock.patch.object(\n                module, "RECONNECT_MAX_DELAY_SECONDS", 0.05\n            ), mock.patch.object(\n                module, "POLL_INTERVAL_SECONDS", 0.01\n            ):\n''',
          )

          replace_once(
              'safety-poc/tests/test_p122_door_media_single_owner.py',
              '''        module.RECONNECT_DELAY_SECONDS = 0\n        module.POLL_INTERVAL_SECONDS = 0\n''',
              '''        module.RECONNECT_INITIAL_DELAY_SECONDS = 0\n        module.RECONNECT_MAX_DELAY_SECONDS = 0\n        module.RECONNECT_NORMAL_DELAY_SECONDS = 0\n        module.POLL_INTERVAL_SECONDS = 0\n''',
          )

          replace_once(
              'safety-poc/tests/test_p16_ha_background_task_contract.py',
              '''        self.assertEqual(\n            runtime.count("self._entry.async_create_background_task("),\n            3,\n        )\n        self.assertIn('"comelit ring media scheduler"', runtime)\n''',
              '''        self.assertEqual(\n            runtime.count("self._entry.async_create_background_task("),\n            4,\n        )\n        self.assertIn('"comelit ring media scheduler"', runtime)\n        self.assertIn('"comelit call-state watchdog"', runtime)\n''',
          )

          replace_once(
              'safety-poc/tests/test_p80_ha_media_entity_wiring.py',
              '''    def test_unload_stops_media_before_supervisor_without_listener_resume(self) -> None:\n        shutdown = self.init.index("await media_manager.async_shutdown()")\n        supervisor_stop = self.init.index("await supervisor.async_stop()", shutdown)\n        self.assertLess(shutdown, supervisor_stop)\n''',
              '''    def test_unload_stops_media_before_supervisor_without_listener_resume(self) -> None:\n        shutdown = self.init.index("media_manager.async_shutdown()")\n        supervisor_stop = self.init.index("supervisor.async_stop()", shutdown)\n        self.assertLess(shutdown, supervisor_stop)\n''',
          )
          replace_once(
              'safety-poc/tests/test_p80_ha_media_entity_wiring.py',
              '''    def test_stream_dependency_is_explicit(self) -> None:\n        self.assertIn("webhook", self.manifest["dependencies"])\n        self.assertIn("stream", self.manifest["dependencies"])\n''',
              '''    def test_stream_dependency_is_explicit(self) -> None:\n        self.assertNotIn("webhook", self.manifest["dependencies"])\n        self.assertIn("stream", self.manifest["dependencies"])\n''',
          )
          PY

      - name: Diff and compile checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m compileall -q custom_components/comelit
          cd safety-poc && python3 scripts/static_safety_check.py

      - name: Hardening regression contract
        run: python3 -m unittest safety-poc/tests/test_runtime_reliability_hardening.py -v

      - name: Full safety-poc unit suite
        shell: bash
        run: |
          set -o pipefail
          cd safety-poc
          PYTHONPATH="$PWD/src" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/final-full-suite.log

      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-full-suite-log
          path: /tmp/final-full-suite.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Mini App Python tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest cryptography
          pytest -q tests/miniapp

      - name: Production negative controls
        shell: bash
        run: |
          set -euo pipefail
          find custom_components/comelit -type d -name __pycache__ -prune -exec rm -rf {} +
          test ! -e custom_components/comelit/test_control.py
          ! grep -R --exclude='*.pyc' --exclude-dir='__pycache__' "child_env = os.environ.copy()" -n custom_components/comelit
          ! grep -R --exclude='*.pyc' --exclude-dir='__pycache__' "async_register_test_control" -n custom_components/comelit

      - name: Commit finalized hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "alexsudakov"
          git config user.email "91778685+alexsudakov@users.noreply.github.com"
          git add custom_components/comelit safety-poc/tests
          git diff --cached --check
          git commit -m "fix(runtime): finalize reliability and security hardening [hardening-finalized]"
          git push origin HEAD:fix/runtime-reliability-security-hardening
