version: 1
# Independent pre-merge safety review is mandatory for safety-sensitive paths.
# DEV v2 derives critic_required_by_policy from this base-owned file only, so a
# workflow contract that requests Critic can never silently disagree with policy.
critic:
  required_paths:
    - 'safety-poc/**'
    - 'custom_components/comelit/**'
    - '.github/workflows/**'
    - '.dev/**'
checks:
  required:
    - 'python3.12 -m pytest -q tests/miniapp'
    - 'python3.12 -m compileall -q custom_components/comelit/miniapp tests/miniapp'
    - 'node --check custom_components/comelit/frontend/miniapp/host.js'
    - 'node --check custom_components/comelit/frontend/miniapp/webcodecs.js'
    - 'node --check custom_components/comelit/frontend/miniapp/vendor/hls.min.js'
    - 'node --check custom_components/comelit/frontend/comelit-card.js'
    # Full offline-safety entrypoint, compatible with strict DEV manifest v1.
    - 'sh safety-poc/scripts/dev_v2_offline_safety.sh'
