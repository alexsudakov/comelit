[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comelit-door-safety-poc"
version = "0.6.0"
description = "Offline safety-state-machine PoC for one-shot critical actions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
comelit-safety-poc = "comelit_safety_poc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
